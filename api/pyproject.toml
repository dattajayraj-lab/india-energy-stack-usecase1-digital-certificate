[project]
name = "cep-api"
version = "0.1.0"
description = "Consumer Energy Passport - DISCOM issuer API and stateless verifier"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "aiosqlite>=0.20",
  "alembic>=1.14",
  "redis>=5.2",
  "fakeredis>=2.26",
  "cryptography>=43",
  "pyjwt[crypto]>=2.10",
  "jsonschema[format]>=4.23",
  "pyld>=2.0.4",
  "rfc8785>=0.1.4",
  "httpx>=0.27",
  "defusedxml>=0.7",
  "argon2-cffi>=23.1",
  "reportlab>=4.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=6", "ruff>=0.8", "bandit>=1.8", "pip-audit>=2.7", "locust>=2.32"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["ies/v1.2/*", "ies/contexts/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["opencred: needs a running OpenCred container (OPENCRED_TEST_URL)"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
